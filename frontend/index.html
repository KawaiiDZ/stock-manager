<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/stokflow-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StokFlow - Business & Inventory POS</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('sm_theme_mode') || 'light';
          var color = localStorage.getItem('sm_color_theme') || 'emerald';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', color);
          document.documentElement.classList.add('theme-' + color);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased select-none font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Build Windows Setup.exe Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    name: Build Windows Installer (StockManager_Setup.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Standalone Application with PyInstaller
        run: |
          pyinstaller --clean -y StockManager.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Windows Setup Wizard with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockManager_Setup
          path: Output/StockManager_Setup.exe
          if-no-files-found: error

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/StockManager_Setup.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
